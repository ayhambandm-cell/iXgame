name: Rebuild iXGAME PS4 Site

on:
  workflow_dispatch:
  push:
    paths:
      - "site.zip"
      - ".github/workflows/rebuild.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site
        shell: bash
        run: |
          set -e

          echo "Cleaning workspace..."

          mkdir -p /tmp/ixgame
          cp site.zip /tmp/ixgame/site.zip

          rm -rf ./*

          echo "Extracting iXGAME site..."

          unzip -o /tmp/ixgame/site.zip -d .

          rm -rf /tmp/ixgame

          echo "Site files:"
          find . -maxdepth 2 -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
