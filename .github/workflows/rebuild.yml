name: CLEAN ENTIRE REPOSITORY

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: DELETE EVERYTHING EXCEPT ZIP
        shell: bash
        run: |
          set -e

          KEEP="iXGAME-from-scratch.zip"

          echo "======================================"
          echo "      iXGAME FULL REPOSITORY CLEAN"
          echo "======================================"

          # التأكد من وجود ZIP
          if [ ! -f "$KEEP" ]; then
            echo "ERROR:"
            echo "$KEEP was not found!"
            exit 1
          fi

          echo ""
          echo "Keeping:"
          echo "$KEEP"

          echo ""
          echo "Files currently tracked:"
          git ls-files

          echo ""
          echo "Deleting EVERYTHING except:"
          echo "$KEEP"

          # حذف جميع الملفات المتتبعة ما عدا ZIP
          git ls-files -z | while IFS= read -r -d '' file; do

            if [ "$file" != "$KEEP" ]; then
              echo "DELETE: $file"
              git rm -f -- "$file"
            else
              echo "KEEP:   $file"
            fi

          done

          echo ""
          echo "Removing empty directories..."

          find . -type d \
            -not -path './.git*' \
            -empty \
            -delete || true

          echo ""
          echo "Remaining files:"
          find . \
            -not -path './.git*' \
            -type f \
            -print

          echo ""
          echo "Committing cleanup..."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "FULL CLEAN: remove old project"

          echo ""
          echo "Pushing cleanup to main..."

          git push origin HEAD:main

          echo ""
          echo "======================================"
          echo " REPOSITORY CLEANUP COMPLETE"
          echo "======================================"
