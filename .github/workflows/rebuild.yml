name: iXGAME Clean Rebuild
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ixgame-pages
  cancel-in-progress: true
jobs:
  build:
    name: Build iXGAME
    runs-on: ubuntu-latest
    steps:
      # ==========================================
      # 1. تحميل مستودع iXGAME
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ==========================================
      # 2. تحميل RAW
      # ==========================================
      - name: Download RAW project
        run: |
          git clone --depth 1 \
            https://github.com/rawgame4/rawgame4.github.io.git \
            /tmp/raw
      # ==========================================
      # 3. حفظ ملفات iXGAME المخصصة
      # ==========================================
      - name: Save iXGAME files
        run: |
          mkdir -p /tmp/ixgame-custom
          cp index.html \
             /tmp/ixgame-custom/index.html
          cp run_lapse.html \
             /tmp/ixgame-custom/run_lapse.html
          if [ -f run_poops.html ]; then
            cp run_poops.html \
               /tmp/ixgame-custom/run_poops.html
          fi
          if [ -f ixgame-banner.png ]; then
            cp ixgame-banner.png \
               /tmp/ixgame-custom/ixgame-banner.png
          fi
      # ==========================================
      # 4. إنشاء Build جديد من الصفر
      # ==========================================
      - name: Create clean build
        run: |
          rm -rf /tmp/build
          mkdir -p /tmp/build
      # ==========================================
      # 5. نسخ محرك RAW فقط
      # ==========================================
      - name: Copy RAW engine
        run: |
          # JavaScript
          find /tmp/raw \
            -maxdepth 1 \
            -type f \
            -name "*.js" \
            -exec cp {} /tmp/build/ \;
          # Binary / WASM
          find /tmp/raw \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.wasm" \
            \) \
            -exec cp {} /tmp/build/ \;
          # Patches
          if [ -d /tmp/raw/patches ]; then
            cp -a /tmp/raw/patches \
              /tmp/build/patches
          fi
      # ==========================================
      # 6. وضع واجهة iXGAME
      # ==========================================
      - name: Install iXGAME interface
        run: |
          cp /tmp/ixgame-custom/index.html \
             /tmp/build/index.html
          cp /tmp/ixgame-custom/run_lapse.html \
             /tmp/build/run_lapse.html
          if [ -f /tmp/ixgame-custom/run_poops.html ]; then
            cp /tmp/ixgame-custom/run_poops.html \
               /tmp/build/run_poops.html
          fi
          if [ -f /tmp/ixgame-custom/ixgame-banner.png ]; then
            cp /tmp/ixgame-custom/ixgame-banner.png \
               /tmp/build/ixgame-banner.png
          fi
      # ==========================================
      # 7. إنشاء Cache Manifest
      # ==========================================
      - name: Create cache manifest
        run: |
          cat > /tmp/build/cache.appcache <<'EOF'
          CACHE MANIFEST
          # iXGAME.io
          # ايهم 2026
          NETWORK:
          *
          EOF
      # ==========================================
      # 8. إزالة هوية RAW القديمة
      # ==========================================
      - name: Remove RAW branding
        run: |
          rm -f /tmp/build/README.md
          rm -f /tmp/build/LICENSE
          rm -f /tmp/build/logo_raw.png
      # ==========================================
      # 9. فحص الموقع قبل النشر
      # ==========================================
      - name: Verify build
        run: |
          echo "=============================="
          echo "      iXGAME BUILD"
          echo "=============================="
          echo ""
          echo "Files:"
          find /tmp/build \
            -maxdepth 2 \
            -type f \
            | sort
          echo ""
          test -f /tmp/build/index.html
          test -f /tmp/build/run_lapse.html
          test -f /tmp/build/chain_lapse.js
          echo ""
          echo "BUILD OK"
      # ==========================================
      # 10. استبدال محتويات المستودع بالبناء الجديد
      # ==========================================
      - name: Replace repository
        run: |
          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +
          cp -a /tmp/build/. .
      # ==========================================
      # 11. حفظ البناء الجديد في GitHub
      # ==========================================
      - name: Commit rebuilt website
        run: |
          git config user.name \
            "iXGAME Builder"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit \
            -m "iXGAME clean rebuild" \
            || echo "No changes"
          git push origin HEAD:main
      # ==========================================
      # 12. إعداد GitHub Pages
      # ==========================================
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      # ==========================================
      # 13. إنشاء Pages Artifact
      # ==========================================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  # ============================================
  # DEPLOY
  # ============================================
  deploy:
    name: Deploy iXGAME
    needs:
      - build
    runs-on:
      ubuntu-latest
    environment:
      name: github-pages
      url:
        ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Show website URL
        run: |
          echo ""
          echo "======================================"
          echo "        iXGAME DEPLOYED"
          echo "======================================"
          echo ""
          echo "Website:"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "======================================"
