name: iXGAME - Clean & Rebuild

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:

  # ==========================================
  # 1. DELETE OLD SITE + BUILD NEW SITE
  # ==========================================
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find iXGAME ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for iXGAME ZIP..."

          ZIP=$(find . -maxdepth 2 -type f \
            \( -name "iXGAME-from-scratch.zip" \
            -o -name "iXGAME-clean-rebuild.zip" \) \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: iXGAME ZIP was not found."
            echo "Upload iXGAME-from-scratch.zip to the repository root."
            exit 1
          fi

          echo "Found:"
          echo "$ZIP"

          cp "$ZIP" /tmp/iXGAME.zip

      - name: DELETE OLD WEBSITE
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " DELETE OLD WEBSITE"
          echo "======================================"

          rm -rf /tmp/site
          mkdir -p /tmp/site

          echo "Old website files will NOT be reused."

      - name: EXTRACT NEW WEBSITE
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " EXTRACT NEW iXGAME WEBSITE"
          echo "======================================"

          unzip -q /tmp/iXGAME.zip -d /tmp/site

          echo "Extracted files:"
          find /tmp/site -type f | sort

      - name: Normalize website root
        shell: bash
        run: |
          set -e

          # Find the actual index.html anywhere inside the ZIP.
          INDEX=$(find /tmp/site -type f -name "index.html" -print -quit)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html was not found in the ZIP."
            exit 1
          fi

          INDEX_DIR=$(dirname "$INDEX")

          echo "Website root:"
          echo "$INDEX_DIR"

          mkdir -p /tmp/final-site

          cp -a "$INDEX_DIR"/. /tmp/final-site/

          echo "Final website:"
          find /tmp/final-site -type f | sort

      - name: Verify new website
        shell: bash
        run: |
          set -e

          test -f /tmp/final-site/index.html

          echo "======================================"
          echo " NEW WEBSITE VERIFIED"
          echo "======================================"

          ls -lah /tmp/final-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload NEW website
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/final-site


  # ==========================================
  # 2. DEPLOY
  # ==========================================
  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:

      - name: Deploy NEW iXGAME website
        id: deployment
        uses: actions/deploy-pages@v4
