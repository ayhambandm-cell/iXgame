name: Rebuild iXGAME PS4 Site

on:
  workflow_dispatch:
  push:
    paths:
      - "iXGAME-clean-rebuild.zip"
      - ".github/workflows/rebuild.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site
        shell: bash
        run: |
          set -e

          echo "Cleaning workspace..."

          mkdir -p /tmp/ixgame
          cp "iXGAME-clean-rebuild.zip" /tmp/ixgame/site.zip

          find . -mindepth 1 \
            -not -path './.git' \
            -not -path './.git/*' \
            -not -path './.github' \
            -not -path './.github/*' \
            -not -name 'iXGAME-clean-rebuild.zip' \
            -delete

          echo "Extracting iXGAME site..."

          unzip -o /tmp/ixgame/site.zip -d .

          rm -rf /tmp/ixgame

          echo "Site files:"
          find . -maxdepth 3 -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
