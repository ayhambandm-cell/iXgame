
name: iXGAME Auto Extract and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ixgame-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Repository
        uses: actions/checkout@v4

      - name: Extract ZIP and Prepare Website
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil

          root = Path(".").resolve()

          zip_names = [
              "iXGAME-PS4-Platform-Full.zip",
              "iXGAME-PS4-Platform.zip",
              "ixgame.zip"
          ]

          archive = next(
              (root / name for name in zip_names
               if (root / name).is_file()),
              None
          )

          if archive is None:
              raise SystemExit(
                  "ERROR: ZIP file not found in repository root."
              )

          staging = root / ".ixgame-extract"

          if staging.exists():
              shutil.rmtree(staging)

          staging.mkdir()

          with ZipFile(archive) as zf:
              for item in zf.infolist():
                  target = (staging / item.filename).resolve()

                  if target != staging and staging not in target.parents:
                      raise SystemExit(
                          f"Unsafe ZIP path: {item.filename}"
                      )

              zf.extractall(staging)

          index_files = list(staging.rglob("index.html"))

          if not index_files:
              raise SystemExit("index.html not found inside ZIP.")

          site_root = index_files[0].parent

          if not (site_root / "assets").exists():
              raise SystemExit("assets folder is missing.")

          if not (site_root / "pages").exists():
              raise SystemExit("pages folder is missing.")

          output = root / "_site"

          if output.exists():
              shutil.rmtree(output)

          shutil.copytree(site_root, output)

          if not (output / "index.html").exists():
              raise SystemExit("Website preparation failed.")

          print("iXGAME extracted successfully.")
          print("Website is ready for deployment.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish iXGAME
        id: deployment
        uses: actions/deploy-pages@v4
