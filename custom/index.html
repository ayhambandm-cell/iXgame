<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iXGAME.io — PS4 WebKit</title>
<style>
  :root {
    --red:#ff1b1b;
    --red2:#a30000;
    --bg:#050506;
    --panel:rgba(12,12,14,.90);
    --line:rgba(255,30,30,.34);
    --text:#f2f2f2;
    --muted:#9b9b9b;
  }
  * { box-sizing:border-box; }
  html,body {
    margin:0; padding:0; min-height:100%;
    background:#050506; color:var(--text);
    font:15px/1.45 "Segoe UI",system-ui,sans-serif;
  }
  body {
    background:
      radial-gradient(circle at 50% 0%, rgba(255,0,0,.16), transparent 42%),
      linear-gradient(#050506,#080809);
  }
  a { color:inherit; text-decoration:none; }
  #brand {
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:11px 18px;
    background:rgba(5,5,6,.94);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(8px);
  }
  .brand-name { font-weight:900; letter-spacing:.16em; }
  .brand-name span { color:var(--red); }
  .tg {
    border:1px solid var(--line);
    padding:7px 11px; border-radius:8px;
    font-size:12px; color:#fff;
  }
  .tg:hover { background:rgba(255,20,20,.13); }
  #wrap { width:min(1100px,100%); margin:auto; padding:14px; }
  .hero {
    position:relative; overflow:hidden;
    border:1px solid var(--line);
    border-radius:14px;
    background:#090909;
    box-shadow:0 0 35px rgba(255,0,0,.12);
  }
  .hero img {
    display:block; width:100%; height:auto;
    aspect-ratio:16/9; object-fit:cover;
  }
  .hero::after {
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background:linear-gradient(180deg,transparent 58%,rgba(0,0,0,.5));
  }
  .status {
    margin-top:14px;
    padding:15px;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel);
  }
  #state { font-size:22px; font-weight:800; margin:0 0 6px; }
  #det { font-size:13px; color:var(--muted); margin:0 0 4px; }
  #det b { color:#fff; font-weight:700; }
  #cache { font-size:12px; color:#686868; min-height:18px; }
  .ok { color:#7fd0a0; } .bad { color:#ff7777; } .warn { color:#ffd36a; }
  .footer {
    display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin:12px 2px 4px; color:#777; font-size:11px;
  }
  .footer strong { color:#ddd; }
  @media (max-width:650px) {
    #brand { padding:10px 12px; }
    #wrap { padding:10px; }
    .hero { border-radius:10px; }
    #state { font-size:18px; }
  }
</style>
</head>
<body>
<div id="brand">
  <div class="brand-name"><span>iX</span>GAME.io</div>
  <a class="tg" href="https://t.me/t_9_k">Telegram: @t_9_k</a>
</div>

<div id="wrap">
  <section class="hero">
    <img src="ixgame-banner.png" alt="iXGAME.io PS4 WebKit">
  </section>

  <section class="status">
    <div id="state">detecting firmware...</div>
    <div id="det"></div>
    <div id="cache"></div>
  </section>

  <div class="footer">
    <div><strong>iXGAME.io</strong> · ايهم 2026</div>
    <div>PS4 WebKit interface · Custom UI</div>
  </div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "ok" : ""; }
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50";
    } else {
        why = key + " -- no working bug (lapse ends at 12.02, poops needs 12.50)";
    }
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + " &middot; bug <b>" + (bug || "none") + "</b> &middot; " + why;

    if (!bug) { setState("UNSUPPORTED FIRMWARE", "bad"); return; }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html")
        + location.search;
    function go() {
        setState("loading " + bug + " chain...", "warn");
        location.replace(target);
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
